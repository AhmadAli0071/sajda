name: sajda_dataplus
description: "Daily Athan: Namaz & Qibla — complete Islamic lifestyle app."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.0
  google_sign_in: ^6.3.0
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  flutter_compass: ^0.8.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  quran: ^1.4.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  share_plus: ^13.3.0
  wakelock_plus: ^1.7.0
  url_launcher: ^6.3.2
  in_app_review: ^2.0.12
  path_provider: ^2.1.6
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  timezone_finder: ^0.2.0
  hijri: ^3.0.1
  uuid: ^4.5.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    - assets/audio/adhan.ogg
    - assets/audio/tick.wav


flutter_launcher_icons:
  android: true
  ios: false
  image_path: app_icon.png
  adaptive_icon_background: "#0F4C35"
  adaptive_icon_foreground: app_icon.png
  min_sdk_android: 21
